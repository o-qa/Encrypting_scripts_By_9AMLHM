<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9AMLHM - Ultimate Lua Protector</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: #020005;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(168, 85, 247, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(236, 72, 153, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(126, 34, 206, 0.2) 0%, transparent 40%);
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: rgba(10, 4, 20, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(147, 51, 234, 0.3);
            backdrop-filter: blur(25px);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-box {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.7);
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1px;
            line-height: 1.1;
            background: linear-gradient(to right, #fff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 11px;
            color: #c084fc;
            font-weight: 700;
        }

        .owner-btn {
            background: rgba(147, 51, 234, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.5);
            color: #e9d5ff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .owner-btn:hover {
            background: rgba(147, 51, 234, 0.4);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.6);
        }

        .main-title {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .sub-desc {
            text-align: center;
            font-size: 12px;
            color: #c084fc;
            margin-bottom: 22px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #e9d5ff;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .char-count {
            font-size: 11px;
            color: #a78bfa;
        }

        select {
            width: 100%;
            background: #06020e;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 16px;
            color: #f3e8ff;
            padding: 14px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 18px;
        }

        select:focus {
            border-color: #ec4899;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        }

        select option {
            background: #0e0619;
            color: #fff;
            padding: 12px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #040108;
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 18px;
            color: #f3e8ff;
            padding: 14px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            resize: none;
            outline: none;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #c084fc;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.3);
        }

        .btn-encrypt {
            width: 100%;
            background: linear-gradient(135deg, #9333ea, #db2777);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
            font-size: 16px;
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn-encrypt:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(147, 51, 234, 0.7);
            background: linear-gradient(135deg, #a855f7, #ec4899);
        }

        .output-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            background: rgba(30, 12, 60, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #e9d5ff;
            padding: 13px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-action:hover {
            background: rgba(147, 51, 234, 0.4);
            color: #fff;
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        #toast {
            visibility: hidden;
            min-width: 240px;
            background: rgba(15, 6, 28, 0.98);
            color: #fff;
            text-align: center;
            border-radius: 14px;
            padding: 14px;
            position: fixed;
            z-index: 99;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            border: 1px solid #c084fc;
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.6);
            font-size: 13px;
            font-weight: 700;
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2.2s;
        }

        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

    <div id="toast">تم التشغيل بنجاح</div>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="brand-area">
                <div class="logo-box">9</div>
                <div>
                    <div class="brand-title">9AMLHM</div>
                    <div class="brand-sub">by 9AMLHM HUB</div>
                </div>
            </div>
            <button class="owner-btn" onclick="showToast('لوحة التحكم خاصة بـ 9AMLHM فقط')">Owner Panel</button>
        </div>

        <div class="main-title">9AMLHM Script Protector</div>
        <div class="sub-desc">درع الحماية الأسطوري المضاد للسرقة والتفكيك</div>

        <!-- Encryption Type Select -->
        <div class="input-group">
            <div class="label-row">
                <span>اختر قوة التشفير وحماية المضادة للسحب</span>
            </div>
            <select id="encryptType">
                <option value="mythic">حماية أسطورية مع نظام مصيدة الإعلانات (الأقوى ضد السرقة)</option>
                <option value="very_strong_4">تشفير مكثف وطويل مع طبقات وهمية</option>
                <option value="very_strong_2">تشفير مزدوج XOR متقدم</option>
                <option value="weak">تشفير خفيف وسريع</option>
            </select>
        </div>

        <!-- Script Input Area -->
        <div class="input-group">
            <div class="label-row">
                <span>ضع السكربت الخاص بك هنا</span>
                <span class="char-count" id="charCount">0 حروف</span>
            </div>
            <textarea id="scriptInput" placeholder="-- ضع كود الـ Lua هنا..." oninput="updateStats()"></textarea>
        </div>

        <!-- Encrypt Button -->
        <button class="btn-encrypt" onclick="encryptScript()">
            تشفير السكربت وحمايته الآن
        </button>

        <!-- Output Area -->
        <div class="input-group">
            <div class="label-row">
                <span>السكربت المشفر المحمي الناتج</span>
            </div>
            <textarea id="scriptOutput" readonly placeholder="-- سيظهر السكربت المشفر هنا..."></textarea>
            
            <div class="output-actions">
                <button class="btn-action" onclick="copyCode()">نسخ الكود المشفر</button>
                <button class="btn-action" onclick="downloadCode()">تحميل كملف .lua</button>
            </div>
        </div>
    </div>

    <script>
        function showToast(msg) {
            let t = document.getElementById("toast");
            t.textContent = msg;
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 2500);
        }

        function updateStats() {
            let text = document.getElementById('scriptInput').value;
            document.getElementById('charCount').textContent = text.length + ' حروف';
        }

        function toBytes(str) {
            let bytes = [];
            for (let i = 0; i < str.length; i++) {
                bytes.push(str.charCodeAt(i));
            }
            return bytes;
        }

        function encryptScript() {
            let code = document.getElementById('scriptInput').value;
            if (!code.trim()) {
                showToast('الرجاء إدخال السكربت أولاً');
                return;
            }

            let type = document.getElementById('encryptType').value;
            let result = "";

            let k1 = Math.floor(Math.random() * 200) + 30;
            let k2 = Math.floor(Math.random() * 200) + 30;
            let rawBytes = toBytes(code);

            // النص المطلوب حرفياً في بداية كل تشفير
            let banner = `-- هههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههه تحاول تفك تشفير السكربت شقلب بس هذا السكربت تحت حماية الساطي صاملهم🤗\n`;

            if (type === "weak") {
                let bytesStr = rawBytes.join(",");
                result = banner +
                    `local b = {${bytesStr}};\n` +
                    `local s = ""; for i=1, #b do s = s .. string.char(b[i]) end;\n` +
                    `local fn = loadstring or load;\n` +
                    `fn(s)();`;

            } else if (type === "very_strong_2") {
                let encArr = rawBytes.map(b => (b ^ k1) ^ k2);
                result = banner +
                    `local K1, K2 = ${k1}, ${k2};\n` +
                    `local E = {${encArr.join(",")}};\n` +
                    `local function Run()\n` +
                    `    local s = "";\n` +
                    `    for i=1, #E do s = s .. string.char(bit32.bxor(bit32.bxor(E[i], K2), K1)) end;\n` +
                    `    local fn = loadstring or load; return fn(s);\n` +
                    `end;\n` +
                    `Run()();`;

            } else if (type === "very_strong_4") {
                let junkLines = "";
                for(let i=0; i<60; i++) {
                    let randName = "_fake_" + Math.random().toString(36).substring(7);
                    junkLines += `local ${randName} = function() return "${Math.random()}" end;\n`;
                }
                let encArr = rawBytes.map(b => (b ^ k1) ^ k2);
                result = banner +
                    `-- [Anti-Scraper Dummy Layers]\n` +
                    junkLines +
                    `local K1, K2 = ${k1}, ${k2};\n` +
                    `local E = {${encArr.join(",")}};\n` +
                    `local function Run()\n` +
                    `    local s = "";\n` +
                    `    for i=1, #E do s = s .. string.char(bit32.bxor(bit32.bxor(E[i], K2), K1)) end;\n` +
                    `    local fn = loadstring or load; return fn(s);\n` +
                    `end;\n` +
                    `Run()();`;

            } else {
                // النظام الأسطوري مع مصيدة السحب والروابط الإعلانية التمويهية
                let encArr = rawBytes.map(b => (((b ^ k1) ^ k2) ^ 7) ^ 19);
                result = banner +
                    `-- [ANTI-DUMP & STEAL PROTECTION ACTIVE]\n` +
                    `local _ENV_CHECK = (getgenv and getgenv()) or shared or _G;\n` +
                    `if not _ENV_CHECK or not bit32 then\n` +
                    `    -- إذا حاول شخص سرقة السكربت ووضعه في موقع استخراج وهمي أو سحبه من باسبين بشكل خاطئ\n` +
                    `    print("ERROR: Unauthorized script dumping detected!");\n` +
                    `    print("Visit official ads: https://bit.ly/fake-ads-for-script-stealers-0192837465");\n` +
                    `    error("This script is secured by 9AMLHM Protector. Stealing is prohibited!");\n` +
                    `end;\n` +
                    `local _K1, _K2, _M1, _M2 = ${k1}, ${k2}, 7, 19;\n` +
                    `local _P = {${encArr.join(",")}};\n` +
                    `local function _9AMLHM_Exec()\n` +
                    `    local res = {};\n` +
                    `    for i = 1, #_P do\n` +
                    `        local b = _P[i];\n` +
                    `        local d = bit32.bxor(bit32.bxor(bit32.bxor(bit32.bxor(b, _M2), _M1), _K2), _K1);\n` +
                    `        res[i] = string.char(d);\n` +
                    `    end;\n` +
                    `    local codeStr = table.concat(res);\n` +
                    `    local loader = loadstring or load;\n` +
                    `    local ok, fn = pcall(function() return loader(codeStr) end);\n` +
                    `    if ok and fn then fn() else warn("9AMLHM Protector: Execution check failed.") end\n` +
                    `end;\n` +
                    `_9AMLHM_Exec();`;
            }

            document.getElementById('scriptOutput').value = result;
            showToast('تم التشفير الأسطوري بنجاح!');
        }

        function copyCode() {
            let output = document.getElementById('scriptOutput');
            if(!output.value) { showToast('لا يوجد كود للنسخ'); return; }
            output.select();
            document.execCommand('copy');
            showToast('تم نسخ الكود المشفر');
        }

        function downloadCode() {
            let code = document.getElementById('scriptOutput').value;
            if (!code) { showToast('لا يوجد كود للتحميل'); return; }
            let blob = new Blob([code], { type: 'text/plain' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '9AMLHM_Protected.lua';
            link.click();
            showToast('بدء تحميل الملف المشفر');
        }
    </script>
</body>
</html>
