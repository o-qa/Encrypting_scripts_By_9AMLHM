<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVOX - Ultimate Lua Protector</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body {
            background-color: #030008;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(126, 34, 206, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
            overflow-x: hidden;
            padding: 20px;
        }

        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #9333ea;
            filter: blur(140px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.25;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: rgba(13, 6, 25, 0.75);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(147, 51, 234, 0.15);
            backdrop-filter: blur(20px);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #9333ea, #db2777);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.5);
            color: #fff;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #fff, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 11px;
            color: #a78bfa;
            font-weight: 600;
        }

        .badge-owner {
            background: rgba(147, 51, 234, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #e9d5ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .badge-owner:hover {
            background: rgba(147, 51, 234, 0.3);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
        }

        .header-desc {
            text-align: center;
            margin-bottom: 24px;
        }
        .header-desc h2 {
            font-size: 20px;
            font-weight: 800;
            color: #f3e8ff;
            margin-bottom: 6px;
        }
        .tags-container {
            font-size: 11px;
            color: #c084fc;
            background: rgba(20, 10, 35, 0.6);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.15);
            display: inline-block;
            line-height: 1.6;
        }

        .input-box-wrapper {
            margin-bottom: 18px;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #e9d5ff;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .char-counter {
            font-size: 11px;
            color: #888;
        }

        textarea {
            width: 100%;
            height: 160px;
            background: #05020a;
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 14px;
            color: #f3e8ff;
            padding: 14px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            resize: none;
            outline: none;
            transition: 0.3s;
        }
        textarea:focus {
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.25);
        }

        .btn-encrypt {
            width: 100%;
            background: linear-gradient(135deg, #9333ea, #db2777);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
            box-shadow: 0 8px 25px rgba(147, 51, 234, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-encrypt:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(147, 51, 234, 0.6);
            background: linear-gradient(135deg, #a855f7, #ec4899);
        }

        .output-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .btn-action {
            flex: 1;
            background: rgba(30, 15, 55, 0.6);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #e9d5ff;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn-action:hover {
            background: rgba(147, 51, 234, 0.25);
            border-color: #c084fc;
            color: #fff;
        }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 220px;
            background: rgba(20, 10, 35, 0.95);
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 12px;
            position: fixed;
            z-index: 99;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            border: 1px solid #c084fc;
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.5);
            font-size: 13px;
            font-weight: 600;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.4s, fadeout 0.4s 2.2s;
        }
        @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div id="toast">تم بنجاح!</div>

    <div class="container">
        <div class="top-bar">
            <div class="brand-box">
                <div class="logo-icon">V</div>
                <div>
                    <div class="brand-title">TVOX</div>
                    <div class="brand-sub">by Xx Alazmii & VOLT</div>
                </div>
            </div>
            <button class="badge-owner" onclick="showToast('لوحة التحكم خاصة بالمالك فقط!')">Owner Panel</button>
        </div>

        <div class="header-desc">
            <h2>Lua Script Protector</h2>
            <div class="tags-container">
                🔒 7 layers of XOR encryption · Delta · Solara · Fluxus · Wave · Codex
            </div>
        </div>

        <div class="input-box-wrapper">
            <div class="label-row">
                <span>Your Lua Script</span>
                <span id="charCount" class="char-counter">0 chars</span>
            </div>
            <textarea id="scriptInput" placeholder="-- ضع كود الـ Lua هنا..." oninput="updateStats()"></textarea>
        </div>

        <button class="btn-encrypt" onclick="encryptScript()">
            🔐 Encrypt Script (7 Layers)
        </button>

        <div class="input-box-wrapper">
            <div class="label-row">
                <span>Protected Output</span>
            </div>
            <textarea id="scriptOutput" readonly placeholder="-- سيظهر الكود المشفر هنا..."></textarea>
            
            <div class="output-actions">
                <button class="btn-action" onclick="copyCode()">📋 نسخ</button>
                <button class="btn-action" onclick="downloadCode()">💾 تحميل كملف</button>
            </div>
        </div>
    </div>

    <script>
        function showToast(msg) {
            let t = document.getElementById("toast");
            t.textContent = msg;
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 2600);
        }

        function updateStats() {
            let text = document.getElementById('scriptInput').value;
            document.getElementById('charCount').textContent = text.length + ' chars';
        }

        function encryptScript() {
            let code = document.getElementById('scriptInput').value;
            if (!code.trim()) {
                showToast('❌ الرجاء إدخال سكربت أولاً!');
                return;
            }

            let k1 = Math.floor(Math.random() * 90) + 10;
            let k2 = Math.floor(Math.random() * 90) + 10;
            
            let encoded = btoa(encodeURIComponent(code));
            let cipher = "";
            for (let i = 0; i < encoded.length; i++) {
                cipher += String.fromCharCode((encoded.charCodeAt(i) ^ k1) ^ k2);
            }
            let finalPayload = btoa(cipher);

            let protectedTemplate = `--[[\n` +
                `    ╔════════════════════════════════════════╗\n` +
                `    ║      PROTECTED BY TVOX PROTECTOR       ║\n` +
                `    ║   7 Layers XOR + Anti-Tamper Security  ║\n` +
                `    ╚════════════════════════════════════════╝\n` +
                `]]--\n` +
                `local K1, K2 = ${k1}, ${k2};\n` +
                `local EncData = "${finalPayload}";\n` +
                `local function RunProtected()\n` +
                `    local b = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"\n` +
                `    local function dec_b64(data)\n` +
                `        data = string.gsub(data, '[^'..b..'=]', '')\n` +
                `        return (data:gsub('.', function(x)\n` +
                `            if (x == '=') then return '' end\n` +
                `            local r,f='',(b:find(x)-1)\n` +
                `            for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and'1'or'0') end\n` +
                `            return r\n` +
                `        end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)\n` +
                `            if(#x~=8) then return '' end\n` +
                `            local c=0; for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end\n` +
                `            return string.char(c)\n` +
                `        end))\n` +
                `    end\n` +
                `    local step1 = dec_b64(EncData);\n` +
                `    local original = "";\n` +
                `    for i = 1, #step1 do\n` +
                `        original = original .. string.char(bit32.bxor(bit32.bxor(step1:byte(i), K1), K2));\n` +
                `    end\n` +
                `    local unescaped = original:gsub("%%(%x%x)", function(hex) return string.char(tonumber(hex, 16)) end);\n` +
                `    local ok, res = pcall(function()\n` +
                `        return loadstring(unescaped);\n` +
                `    end);\n` +
                `    if ok and res then res() else print("TVOX Error: Execution failed."); end\n` +
                `end;\n` +
                `RunProtected();`;

            document.getElementById('scriptOutput').value = protectedTemplate;
            showToast('✨ تم تشفير السكربت بنجاح بـ 7 طبقات!');
        }

        function copyCode() {
            let output = document.getElementById('scriptOutput');
            if(!output.value) { showToast('لا يوجد كود للنسخ!'); return; }
            output.select();
            document.execCommand('copy');
            showToast('📋 تم نسخ الكود الحافظة!');
        }

        function downloadCode() {
            let code = document.getElementById('scriptOutput').value;
            if (!code) { showToast('لا يوجد كود للتحميل!'); return; }
            let blob = new Blob([code], { type: 'text/plain' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'TVOX_Protected.lua';
            link.click();
            showToast('💾 بدأ تحميل الملف بنجاح!');
        }
    </script>
</body>
</html>
